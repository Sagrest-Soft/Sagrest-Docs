name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main  # Attiva il workflow su ogni push alla branch main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build Docusaurus site
        run: pnpm run build

      - name: Run embedding script
        run: pnpm run embed

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/vector-cache-metadata.json static/vector-cache.zip
          if git diff --staged --quiet; then
            echo "No changes to vector cache files."
          else
            git commit -m "chore: update vector cache [skip ci]"
            git push
          fi

      - name: Sync new cache to build directory
        run: |
          cp static/vector-cache-metadata.json build/
          cp static/vector-cache.zip build/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: docs.sagrest.it
